<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festa do Noah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding-bottom: 140px;
        }
        @media (min-width: 768px) {
            body {
                padding-bottom: 96px;
            }
        }

       
    </style>
</head>
<body class="convite-fundo">

    <main class="flex justify-center p-4 pt-8 md:pt-12">
        <div class="card-convite w-full max-w-3xl p-8 md:p-12 rounded-lg shadow-xl text-center">

            <h1 class="text-4xl md:text-5xl text-gray-800 mb-6">Niver do Noah!</h1>
            
            <div class="text-gray-600 space-y-4 text-base md:text-lg leading-relaxed">
                <p>
                    Com grande alegria, convidamos você para celebrar um momento inesquecível conosco.
                    Reserve esta data para compartilhar risadas, boas energias e memórias.</P>
                </p>
                <p class="font-semibold text-gray-700 mt-4">
                    Data: Sábado, 17 de Janeiro<br>
                    Horário: 18:00h
                </p>
            </div>

            <p class="mt-8 text-xl font-bold text-red-800 animate-pulse">
                Esperamos você!
            </p>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 w-full bg-gray-900/80 text-white p-4 shadow-lg backdrop-filter backdrop-blur-lg">
        
        <img src="img/mickey2.png" alt="Mickey" class="mickey-left">
        <img src="img/mickey.png" alt="Mickey" class="mickey-right">

        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between space-y-4 md:space-y-0">
            
            <div class="flex flex-col items-center w-full md:w-auto">

                <a 
                    href="https://maps.app.goo.gl/9fDHysKcF7DJ5e6i8" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    class="inline-flex items-center justify-center px-6 py-2 border border-gray-400 text-sm font-medium rounded-md shadow-sm text-white bg-transparent hover:bg-gray-700 transition-colors duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500"
                >
                    <svg class="mr-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    Ver Endereço
                </a>
            </div>

            <div class="text-center">
                 <h2 class="text-xl">Confirme sua Presença</h2>
            </div>
            
            <div class="w-full md:w-auto text-center">
                <a 
                    href="https://docs.google.com/forms/d/e/1FAIpQLSeD74eLBQSzCjSVeeqGiE4V2y50Cj8BPFyeyR2lD1CLyLj4SA/viewform" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    class="w-full md:w-auto inline-flex items-center justify-center px-8 py-3 border border-transparent text-base font-medium rounded-md shadow-lg text-gray-900 bg-yellow-400 hover:bg-yellow-500 transition-colors duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500"
                >
                    Confirme!
                    <svg class="ml-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </a>
            </div>

        </div>
    </footer>

</body>
</html>
